<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="author" content="Ondrandy" />
  <title>Carline</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #dcdfe4;
      --wall: #1e293b;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-text: #ffffff;
      --status-bg: #e8f0fe;
      --status-text: #1d4ed8;
      --trial-bg: #fffbeb;
      --trial-border: #f59e0b;
      --trial-text: #b45309;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --error-text: #b91c1c;
      --success-bg: #ecfdf5;
      --success-border: #86efac;
      --success-text: #15803d;
      --track-bed: #e2e8f0;
      --track-rail: #1e293b;
      --track-under: #64748b;
      --track-over: #0f172a;
      --start-color: #16a34a;
      --c0: #475569;
      --c1: #2563eb;
      --c2: #16a34a;
      --c3: #d97706;
      --c4: #7c3aed;
      --c5: #0891b2;
      --c6: #e11d48;
      --car-color: #e11d48;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body[data-theme="emerald"] {
      --bg: #064e3b;
      --card: #065f46;
      --border: #047857;
      --wall: #fbbf24;
      --text: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent: #fbbf24;
      --accent-dark: #f59e0b;
      --accent-text: #064e3b;
      --status-bg: #047857;
      --status-text: #fde68a;
      --trial-bg: #451a03;
      --trial-border: #fbbf24;
      --trial-text: #fde68a;
      --error-bg: #450a0a;
      --error-border: #f87171;
      --error-text: #fecaca;
      --success-bg: #022c22;
      --success-border: #34d399;
      --success-text: #6ee7b7;
      --track-bed: #047857;
      --track-rail: #fde68a;
      --track-under: #10b981;
      --track-over: #fbbf24;
      --start-color: #34d399;
      --car-color: #fbbf24;
    }

    body[data-theme="tournament"] {
      --bg: #eef2ff;
      --card: #ffffff;
      --border: #c7d2fe;
      --wall: #1d4ed8;
      --text: #1e1b4b;
      --text-muted: #4338ca;
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --accent-text: #ffffff;
      --status-bg: #e0e7ff;
      --status-text: #3730a3;
      --track-bed: #dbeafe;
      --track-rail: #1d4ed8;
      --track-under: #0891b2;
      --track-over: #7c3aed;
      --start-color: #16a34a;
      --car-color: #e11d48;
    }

    body[data-theme="royal"] {
      --bg: #0f172a;
      --card: #162033;
      --border: #334155;
      --wall: #fbbf24;
      --text: #f8fafc;
      --text-muted: #cbd5e1;
      --accent: #fbbf24;
      --accent-dark: #d97706;
      --accent-text: #0f172a;
      --status-bg: #1e293b;
      --status-text: #fde68a;
      --trial-bg: #3b1d0e;
      --trial-border: #f59e0b;
      --trial-text: #fcd34d;
      --error-bg: #3f1219;
      --error-border: #fb7185;
      --error-text: #fecdd3;
      --success-bg: #0f2e26;
      --success-border: #34d399;
      --success-text: #a7f3d0;
      --track-bed: #1e293b;
      --track-rail: #e2e8f0;
      --track-under: #f472b6;
      --track-over: #fbbf24;
      --start-color: #34d399;
      --car-color: #fb7185;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 460px;
      height: 100%;
      margin: 0 auto;
      padding: calc(var(--safe-top) + 6px) 8px calc(var(--safe-bottom) + 6px) 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-left {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .header-left span.num {
      color: var(--accent);
    }

    .header-center {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--accent);
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .header-stats {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: right;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-stats strong {
      color: var(--text);
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .status-bar {
      height: 40px;
      min-height: 40px;
      border-radius: 11px;
      background: var(--status-bg);
      color: var(--status-text);
      border: 1px solid transparent;
      padding: 0 8px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar.trial {
      background: var(--trial-bg);
      border-color: var(--trial-border);
      color: var(--trial-text);
    }

    .status-bar.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .status-bar.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .status-text {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .chip-btn {
      height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .board-card {
      flex: 1;
      min-height: 0;
      background: var(--card);
      border: 2.5px solid var(--wall);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    canvas#trackCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .telemetry-pill {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .telemetry-badge {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 8px;
      color: var(--text);
      opacity: 0.92;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 0 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .ctrl-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .ctrl-btn.active-hint {
      background: var(--trial-bg);
      border-color: var(--trial-border);
      color: var(--trial-text);
    }

    .ctrl-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      margin: 0 0 10px 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
    }

    .stats-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .stat-cell-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.15;
    }

    .stat-cell-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .settings-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .setting-tile {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
    }

    .setting-tile select,
    .setting-tile button {
      width: 100%;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      margin: 10px 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .reward-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .reward-tile {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 10px;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: var(--text);
    }

    .reward-tile.selected {
      border: 2px solid var(--accent);
      background: var(--status-bg);
    }

    .reward-tile.locked {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .reward-name {
      font-size: 12px;
      font-weight: 800;
    }

    .reward-req {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .guide-box {
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12.5px;
      line-height: 1.4;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .guide-box.gray {
      background: var(--bg);
      color: var(--text);
    }

    .guide-box.green {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .guide-box.red {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .guide-box ul {
      margin: 4px 0 0 0;
      padding-left: 18px;
    }

    .guide-box li {
      margin-bottom: 3px;
    }

    .modal-full-btn {
      width: 100%;
      height: 40px;
      border-radius: 11px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .modal-row-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-sec-btn {
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .author-footer {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .win-badge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .win-icon-frame {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      border: 2px solid var(--accent);
      background: var(--status-bg);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .win-pill {
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      font-size: 11px;
      font-weight: 800;
    }

    .unlock-banner {
      background: var(--trial-bg);
      border: 1px solid var(--trial-border);
      color: var(--trial-text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
    }

    #landscapeGuard {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #f8fafc;
      z-index: 120;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 16px;
      font-weight: 700;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #landscapeGuard {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="landscapeGuard">
    <div>Otočte prosím telefon na výšku (Portrait) / Please rotate your device to Portrait mode.</div>
  </div>

  <div class="app" id="appRoot">
    <header class="header">
      <div class="header-left">
        <span data-i18n="winsLabel">Výhry</span>: <span class="num" id="hudWins">0</span>
      </div>
      <div class="header-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 16c-2.2 0-3.5-1.6-3.5-3.6 0-2.5 2.4-4.4 5.2-4.4 3.4 0 5.6 8 9.8 8 2.6 0 4.5-1.6 4.5-3.8 0-2.2-1.8-3.8-4.2-3.8-3.6 0-5.8 7.6-11.8 7.6z"/>
        </svg>
        <span>Carline</span>
      </div>
      <div class="header-right">
        <div class="header-stats">
          <div><span data-i18n="lapsShort">Kola</span>: <strong id="hudLaps">0</strong>/<strong id="hudTargetLaps">3</strong></div>
          <div><span data-i18n="exitsShort">Vyletění</span>: <strong id="hudExits">0</strong></div>
        </div>
        <button id="btnSettings" class="icon-btn" type="button" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="status-bar" id="statusBar">
      <div class="status-text" id="statusText" data-i18n="statusDraw">Nakreslete prstem smyčku autodráhy – konec se spojí se začátkem.</div>
      <div class="mode-switch">
        <button id="btnModeAuto" class="chip-btn active" type="button" data-i18n="modeAuto">Auto</button>
        <button id="btnModeManual" class="chip-btn" type="button" data-i18n="modeManual">Manuál</button>
      </div>
    </div>

    <main class="board-card" id="boardCard">
      <canvas id="trackCanvas"></canvas>
      <div class="telemetry-pill">
        <span class="telemetry-badge"><span data-i18n="speedLabel">Rychlost</span>: <strong id="hudSpeed">0</strong></span>
        <span class="telemetry-badge" id="hudGripBadge">MAGNET OK</span>
      </div>
    </main>

    <footer class="controls">
      <button id="btnUndo" class="ctrl-btn" type="button" data-i18n="btnUndo">↩ Zpět</button>
      <button id="btnGuide" class="ctrl-btn" type="button" data-i18n="btnGuide">Návod</button>
      <button id="btnHint" class="ctrl-btn" type="button" data-i18n="btnHint">Rada</button>
      <button id="btnNewGame" class="ctrl-btn primary" type="button" data-i18n="btnNewGame">Nová hra</button>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
