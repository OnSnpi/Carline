<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="author" content="Ondrandy" />
  <title>Carline</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #e2e8f0;
      --wall: #1e293b;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-text: #ffffff;
      --status-bg: #e8f0fe;
      --status-text: #1d4ed8;
      --trial-bg: #fffbeb;
      --trial-border: #f59e0b;
      --trial-text: #b45309;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --error-text: #b91c1c;
      --success-bg: #ecfdf5;
      --success-border: #86efac;
      --success-text: #15803d;
      --track-bed: #e2e8f0;
      --track-rail: #1e293b;
      --track-under: #64748b;
      --track-over: #0f172a;
      --start-color: #16a34a;
      --car-color: #e11d48;
      --ghost-color: rgba(37, 99, 235, 0.42);
      --card-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body[data-theme="emerald"] {
      --bg: #064e3b;
      --card: #065f46;
      --border: #047857;
      --wall: #fbbf24;
      --text: #ecfdf5;
      --text-muted: #a7f3d0;
      --accent: #fbbf24;
      --accent-dark: #f59e0b;
      --accent-soft: #047857;
      --accent-text: #064e3b;
      --status-bg: #047857;
      --status-text: #fde68a;
      --trial-bg: #451a03;
      --trial-border: #fbbf24;
      --trial-text: #fde68a;
      --error-bg: #450a0a;
      --error-border: #f87171;
      --error-text: #fecaca;
      --success-bg: #022c22;
      --success-border: #34d399;
      --success-text: #6ee7b7;
      --track-bed: #047857;
      --track-rail: #fde68a;
      --track-under: #10b981;
      --track-over: #fbbf24;
      --start-color: #34d399;
      --car-color: #fbbf24;
      --ghost-color: rgba(167, 243, 208, 0.42);
    }

    body[data-theme="tournament"] {
      --bg: #eef2ff;
      --card: #ffffff;
      --border: #c7d2fe;
      --wall: #1d4ed8;
      --text: #1e1b4b;
      --text-muted: #4338ca;
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --accent-soft: #f5f3ff;
      --accent-text: #ffffff;
      --status-bg: #e0e7ff;
      --status-text: #3730a3;
      --track-bed: #dbeafe;
      --track-rail: #1d4ed8;
      --track-under: #0891b2;
      --track-over: #7c3aed;
      --start-color: #16a34a;
      --car-color: #e11d48;
      --ghost-color: rgba(124, 58, 237, 0.38);
    }

    body[data-theme="royal"] {
      --bg: #0f172a;
      --card: #162033;
      --border: #334155;
      --wall: #fbbf24;
      --text: #f8fafc;
      --text-muted: #cbd5e1;
      --accent: #fbbf24;
      --accent-dark: #d97706;
      --accent-soft: #1e293b;
      --accent-text: #0f172a;
      --status-bg: #1e293b;
      --status-text: #fde68a;
      --trial-bg: #3b1d0e;
      --trial-border: #f59e0b;
      --trial-text: #fcd34d;
      --error-bg: #3f1219;
      --error-border: #fb7185;
      --error-text: #fecdd3;
      --success-bg: #0f2e26;
      --success-border: #34d399;
      --success-text: #a7f3d0;
      --track-bed: #1e293b;
      --track-rail: #e2e8f0;
      --track-under: #f472b6;
      --track-over: #fbbf24;
      --start-color: #34d399;
      --car-color: #fb7185;
      --ghost-color: rgba(251, 191, 36, 0.36);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 460px;
      height: 100%;
      margin: 0 auto;
      padding: calc(var(--safe-top) + 8px) 10px calc(var(--safe-bottom) + 8px) 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 7px 11px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      box-shadow: var(--card-shadow);
      flex-shrink: 0;
    }

    .header-left {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .header-center {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--accent);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .header-stats {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .status-bar {
      min-height: 44px;
      border-radius: 12px;
      background: var(--status-bg);
      color: var(--status-text);
      border: 1px solid transparent;
      padding: 4px 8px 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar.trial {
      background: var(--trial-bg);
      border-color: var(--trial-border);
      color: var(--trial-text);
    }

    .status-bar.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .status-bar.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .status-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status-text {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-sub {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.9;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .action-pill-btn {
      height: 30px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .action-pill-btn:active {
      transform: scale(0.96);
    }

    .action-pill-btn.start-race {
      background: #16a34a;
      border-color: #16a34a;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.28);
    }

    .race-timer-badge {
      height: 30px;
      padding: 0 9px;
      border-radius: 9px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .board-card {
      flex: 1;
      min-height: 0;
      background: var(--card);
      border: 2px solid var(--wall);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    canvas#trackCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      padding: 0 4px;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .ctrl-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .ctrl-btn.active-hint {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .ctrl-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 410px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 16px 16px 16px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.26);
    }

    .modal-title {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
    }

    .stats-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }

    .stat-cell-val {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
    }

    .stat-cell-val.gold {
      color: #d97706;
    }

    .stat-cell-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .section-heading {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      margin: 12px 0 7px 0;
    }

    .choice-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .choice-btn {
      min-height: 42px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .choice-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    body[data-theme="emerald"] .choice-btn.active,
    body[data-theme="royal"] .choice-btn.active {
      color: var(--accent);
    }

    .tile-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .visual-tile {
      position: relative;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 10px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    .visual-tile.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .visual-tile.locked {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .tile-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tile-icon {
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tile-name {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }

    .visual-tile.active .tile-name {
      color: var(--accent-dark);
    }

    body[data-theme="emerald"] .visual-tile.active .tile-name,
    body[data-theme="royal"] .visual-tile.active .tile-name {
      color: var(--accent);
    }

    .tile-trait {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent);
    }

    .tile-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .info-callout {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .info-callout strong {
      color: var(--text);
    }

    .guide-p {
      margin: 0 0 10px 0;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text);
    }

    .guide-box {
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .guide-box.gray {
      background: var(--bg);
      color: var(--text);
    }

    .guide-box.green {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .guide-box ul {
      margin: 4px 0 0 0;
      padding-left: 18px;
    }

    .guide-box li {
      margin-bottom: 5px;
    }

    .guide-box li:last-child {
      margin-bottom: 0;
    }

    .guide-warn {
      margin: 0 0 10px 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--error-text);
    }

    .guide-rewards {
      margin: 0 0 12px 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .guide-rewards strong {
      color: #d97706;
    }

    .modal-full-btn {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    .modal-row-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-sec-btn {
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .author-footer {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .win-badge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .win-icon-frame {
      width: 56px;
      height: 56px;
      border-radius: 15px;
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .win-pill {
      padding: 3px 11px;
      border-radius: 999px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      font-size: 11.5px;
      font-weight: 800;
    }

    .unlock-banner {
      background: var(--trial-bg);
      border: 1px solid var(--trial-border);
      color: var(--trial-text);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
    }

    #landscapeGuard {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #f8fafc;
      z-index: 120;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 16px;
      font-weight: 700;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #landscapeGuard {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="landscapeGuard">
    <div>Otočte prosím telefon na výšku (Portrait) / Please rotate your device to Portrait mode.</div>
  </div>

  <div class="app" id="appRoot">
    <header class="header">
      <div class="header-left">
        <span data-i18n="winsLabel">Výhry</span>: <span id="hudWins">0</span>
      </div>
      <div class="header-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 16c-2.2 0-3.5-1.6-3.5-3.6 0-2.5 2.4-4.4 5.2-4.4 3.4 0 5.6 8 9.8 8 2.6 0 4.5-1.6 4.5-3.8 0-2.2-1.8-3.8-4.2-3.8-3.6 0-5.8 7.6-11.8 7.6z"/>
        </svg>
        <span>Carline</span>
      </div>
      <div class="header-right">
        <div class="header-stats">
          <span data-i18n="lapsShort">Kola</span>: <span id="hudLaps">0</span>/<span id="hudTargetLaps">3</span>
        </div>
        <button id="btnSettings" class="icon-btn" type="button" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="status-bar" id="statusBar">
      <div class="status-main">
        <div class="status-text" id="statusText" data-i18n="statusDraw">Nakreslete prstem smyčku autodráhy.</div>
        <div class="status-sub" id="statusSubText"></div>
      </div>
      <div class="status-action" id="statusActionSlot"></div>
    </div>

    <main class="board-card" id="boardCard">
      <canvas id="trackCanvas"></canvas>
    </main>

    <footer class="controls">
      <button id="btnUndo" class="ctrl-btn" type="button" data-i18n="btnUndo">↩ Zpět</button>
      <button id="btnGuide" class="ctrl-btn" type="button" data-i18n="btnGuide">Návod</button>
      <button id="btnHint" class="ctrl-btn" type="button" data-i18n="btnHint">Rada</button>
      <button id="btnNewGame" class="ctrl-btn primary" type="button" data-i18n="btnNewGame">Nová hra</button>
    </footer>
  </div>
