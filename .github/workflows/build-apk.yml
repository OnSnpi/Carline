name: Build Carline Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            $(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1); do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          fi
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "d56f5fd8722ee57d8460243085a604123a81d80d\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"

      - name: Install Capacitor 6 dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/preferences@6 @capacitor/haptics@6
          npm install -D @capacitor/assets
          
      - name: Initialize Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap init Carline cz.carline.track --web-dir www
            npx cap add android
          fi

      - name: Generate Carline App Icon
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          python3 - << 'EOF'
          import math
          from PIL import Image, ImageDraw

          SIZE = 1024
          bg = Image.new("RGBA", (SIZE, SIZE), (15, 23, 42, 255))
          fg = Image.new("RGBA", (SIZE, SIZE), (0, 0, 0, 0))
          draw = ImageDraw.Draw(fg)

          pts = []
          steps = 360
          cx, cy = SIZE / 2, SIZE / 2
          rx, ry = 310, 220
          for i in range(steps + 1):
              t = (i / steps) * 2 * math.pi
              x = cx + rx * math.sin(t)
              y = cy + ry * math.sin(2 * t) * 0.85
              pts.append((x, y))

          split = steps // 2
          first_half = pts[:split + 1]
          second_half = pts[split:]

          draw.line(first_half, fill=(51, 65, 85, 255), width=92, joint="curve")
          draw.line(first_half, fill=(100, 116, 139, 255), width=52, joint="curve")

          draw.line(second_half, fill=(15, 23, 42, 255), width=108, joint="curve")
          draw.line(second_half, fill=(30, 41, 59, 255), width=92, joint="curve")
          draw.line(second_half, fill=(226, 232, 240, 255), width=52, joint="curve")

          sx, sy = pts[0]
          draw.ellipse((sx - 34, sy - 34, sx + 34, sy + 34), fill=(22, 163, 74, 255), outline=(255, 255, 255, 255), width=8)

          car_idx = 235
          px, py = pts[car_idx]
          nx, ny = pts[car_idx + 2]
          angle = math.atan2(ny - py, nx - px)

          car_img = Image.new("RGBA", (140, 90), (0, 0, 0, 0))
          cd = ImageDraw.Draw(car_img)
          cd.rounded_rectangle((10, 10, 130, 80), radius=22, fill=(239, 68, 68, 255), outline=(255, 255, 255, 255), width=8)
          cd.rectangle((86, 30, 112, 60), fill=(255, 255, 255, 255))

          rotated_car = car_img.rotate(-math.degrees(angle), resample=Image.BICUBIC, expand=True)
          fg.paste(rotated_car, (int(px - rotated_car.width / 2), int(py - rotated_car.height / 2)), rotated_car)

          bg.save("assets/icon-background.png")
          fg.save("assets/icon-foreground.png")
          composite = Image.alpha_composite(bg, fg)
          composite.save("assets/icon-only.png")
          EOF
          npx capacitor-assets generate --android

      - name: Restore Persistent Android Signing Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "CHYBA: Secret KEYSTORE_BASE64 je prazdny!"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > "$GITHUB_WORKSPACE/keystore/ondrandy.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/keystore/ondrandy.keystore" -storepass android

      - name: Configure Explicit Signing and versionCode in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/g" "$BUILD_GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/g" "$BUILD_GRADLE"
          cat << 'EOF' >> "$BUILD_GRADLE"

          android {
              signingConfigs {
                  debug {
                      storeFile file("${System.getenv('GITHUB_WORKSPACE')}/keystore/ondrandy.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Carline.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carline-debug-apk
          path: android/app/build/outputs/apk/debug/Carline.apk
